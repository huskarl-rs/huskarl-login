name: Documentation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  docs:
    name: Examples and API reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo +nightly test --locked --doc --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs_huskarl_login -D warnings
      - run: cargo +nightly doc --locked --no-deps --all-features --document-private-items
        env:
          RUSTDOCFLAGS: --cfg docsrs_huskarl_login -D warnings
