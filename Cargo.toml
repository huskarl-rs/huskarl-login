[package]
name = "huskarl-login"
version = "0.4.0"
edition = "2024"
rust-version = "1.92"
description = "OAuth2/OIDC login flow helpers for huskarl."
repository = "https://github.com/huskarl-rs/huskarl-login"
documentation = "https://docs.rs/huskarl-login"
license = "MIT OR Apache-2.0"
keywords = ["oauth2", "oidc", "security", "authentication", "login"]
categories = ["authentication"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
# Keep the docs.rs-only nightly cfg private to this crate so it cannot activate
# similarly named cfgs in dependencies.
rustdoc-args = ["--cfg", "docsrs_huskarl_login"]

[features]
metrics = ["dep:metrics", "huskarl/metrics", "huskarl-core/metrics"]
test-support = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs_huskarl_login)'] }

[dependencies]
base64 = "0.23"
bon = { version = "3.9", features = ["experimental-generics-setters"] }
bytes = "1"
ciborium = "0.2"
http = { version = "1", default-features = false }
huskarl = { version = "0.11", default-features = false }
# The URL mapping API re-exported by huskarl requires core 0.10.3.
huskarl-core = { version = "0.10.3", default-features = false }
metrics = { version = "0.24", default-features = false, optional = true }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_html_form = "0.4"
serde_json = { version = "1", default-features = false }
snafu = { version = "0.9", default-features = false, features = ["rust_1_81", "std"] }
strum = { version = "0.27", default-features = false, features = ["derive"] }
uuid = { version = "1", features = ["v7", "serde"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { version = "1", features = ["v7", "serde", "js"] }

[dev-dependencies]
metrics = { version = "0.24", default-features = false }
huskarl-reqwest = { version = "0.9", features = ["rustls-tls"] }
hex = "0.4"
huskarl-crypto-native = { version = "0.11" }
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
rand = "0.10"
rstest = "0.26"
tokio = { version = "1", features = ["full"] }
url = "2"
